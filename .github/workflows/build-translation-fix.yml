name: Build translation fix

on:
  push:
    branches:
      - fix/layout-translation-completeness-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build-windows:
    name: Validate and build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Frontend build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      - name: Stage PDFium runtime
        shell: pwsh
        run: pnpm pdfium:stage

      # Rust tests/clippy run in the repository's normal CI. Keep this workflow
      # focused on native Windows packaging so a platform-specific unit-test
      # environment issue cannot prevent production installer generation.
      - name: Build Windows installers
        shell: pwsh
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = "Continue"

          & pnpm tauri info 2>&1 | Tee-Object -FilePath tauri-info.log

          # Passing inline JSON through pnpm.cmd on Windows strips the embedded
          # quotes before Tauri receives it. Use a config file so argv contains
          # only a path and updater artifact generation can still be disabled
          # for this unsigned validation build.
          $overrideConfig = Join-Path $env:RUNNER_TEMP "tauri-translation-fix.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' |
            Set-Content -Path $overrideConfig -Encoding utf8 -NoNewline
          Get-Content $overrideConfig | Add-Content tauri-build.log

          & pnpm tauri build --bundles nsis,msi --config $overrideConfig 2>&1 |
            Tee-Object -FilePath tauri-build-command.log
          $buildExitCode = $LASTEXITCODE
          Get-Content tauri-build-command.log | Add-Content tauri-build.log
          "tauri_exit_code=$buildExitCode" | Add-Content tauri-build.log

          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Upload Tauri diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agentero-windows-tauri-diagnostics
          path: |
            tauri-info.log
            tauri-build.log
            tauri-build-command.log
          if-no-files-found: warn
          retention-days: 14

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            Copy-Item -Destination artifact
          Get-ChildItem artifact

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Agentero-0.9.4-translation-fix-windows
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
