name: Repair translation Rust file

on:
  push:
    branches:
      - fix/layout-translation-completeness-20260906

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore provider implementations from main and patch finish_reason
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:crates/agentero-core/src/features/translate/mod.rs > crates/agentero-core/src/features/translate/mod.rs
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/agentero-core/src/features/translate/mod.rs')
          text = path.read_text()
          fn_anchor = 'async fn translate_openai_compatible('
          fn_start = text.find(fn_anchor)
          if fn_start < 0:
              raise SystemExit('OpenAI-compatible function not found')

          start = text.find('    let v: Value = serde_json::from_str(&body)', fn_start)
          if start < 0:
              raise SystemExit('OpenAI-compatible response start not found')

          end_marker = '\n}\n\n#[cfg(test)]'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('OpenAI-compatible function end not found')
          end += 2

          replacement = '''    let v: Value = serde_json::from_str(&body)
              .map_err(|e| AppError::message(format!("OpenAI-compatible parse: {e}")))?;
          let choice = v
              .get("choices")
              .and_then(|x| x.get(0))
              .ok_or_else(|| AppError::message("Unexpected OpenAI-compatible response"))?;
          if let Some(reason) = choice.get("finish_reason").and_then(|x| x.as_str()) {
              if matches!(reason, "length" | "max_tokens" | "content_filter") {
                  return Err(AppError::message(format!(
                      "OpenAI-compatible translation incomplete (finish_reason={reason}); retry with a smaller chunk"
                  )));
              }
          }
          choice
              .get("message")
              .and_then(|x| x.get("content"))
              .and_then(|x| x.as_str())
              .map(|s| s.to_string())
              .ok_or_else(|| AppError::message("Unexpected OpenAI-compatible response"))
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Format Rust
        run: cargo fmt --all

      - name: Commit repaired file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/agentero-core/src/features/translate/mod.rs
          if git diff --cached --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git commit -m "fix(translate): restore providers and reject truncated OpenAI output"
          git push origin HEAD:fix/layout-translation-completeness-20260906
