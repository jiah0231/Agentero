name: Format translation fix

on:
  push:
    branches:
      - fix/layout-translation-completeness-20260906
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-translation-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/layout-translation-completeness-20260906

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format changed TypeScript
        run: >-
          pnpm exec biome format --write
          src/lib/pdf/layout/layout-translate-reliable.ts
          src/components/viewer/pdf/hooks/use-pdf-layout-translate.ts
          src/components/viewer/pdf/layers/layout-translate-overlay.tsx
          src/lib/pdf/layout/index.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pdf/layout/layout-translate-reliable.ts src/components/viewer/pdf/hooks/use-pdf-layout-translate.ts src/components/viewer/pdf/layers/layout-translate-overlay.tsx src/lib/pdf/layout/index.ts
          git commit -m "style: format layout translation fix"
          git push origin HEAD:fix/layout-translation-completeness-20260906
